server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Fallback SPA: si la ruta no es un archivo ni un directorio,
        # se entrega index.html y React resuelve la ruta en el cliente.
        try_files $uri $uri/ /index.html;
    }

    # Opcional: cache agresiva para assets con hash de contenido (Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
