# =============================================================================
# Taller Evaluativo 2 - Fase 3: Orquestación del Ecosistema CI/CD
# Jenkins (orquestador) + smee-client (relay de webhooks de GitHub)
#
# Levantar PRIMERO este stack (crea la red cicd_network que usa Nexus).
# =============================================================================

services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    networks:
      - cicd_network
    ports:
      - "${JENKINS_UI_PORT:-9082}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Socket del daemon Docker del host: Jenkins construye/publica/despliega
      - /var/run/docker.sock:/var/run/docker.sock
    # En Docker Desktop el socket montado pertenece a root:root (660).
    # En lugar de ejecutar Jenkins como root, se añade el grupo del socket
    # (GID 0) como grupo suplementario del usuario jenkins.
    group_add:
      - "${DOCKER_SOCK_GID:-0}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/login > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  smee:
    build: ./smee
    container_name: smee-client
    restart: unless-stopped
    environment:
      SMEE_URL: ${SMEE_CHANNEL_URL}
      SMEE_TARGET: http://jenkins:8080/github-webhook/
    networks:
      - cicd_network
    depends_on:
      jenkins:
        condition: service_started

networks:
  cicd_network:
    name: cicd_network

volumes:
  jenkins_home:
