### Los 6 microservicios del Taller 2
### kubectl apply -n <namespace> -f k8s/services.yaml
### La imagen lleva el placeholder __TAG__ que el pipeline reemplaza con sed.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  labels: { app: identity-service, tier: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: identity-service }
  template:
    metadata:
      labels: { app: identity-service }
    spec:
      containers:
        - name: identity-service
          image: circleguard/identity:__TAG__
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8083 }]
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/circleguard_identity
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: circleguard-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: circleguard-secrets, key: POSTGRES_PASSWORD } }
          resources:
            requests: { memory: "384Mi", cpu: "150m" }
            limits: { memory: "768Mi", cpu: "600m" }
          readinessProbe:
            tcpSocket: { port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  selector: { app: identity-service }
  ports: [{ port: 8083, targetPort: 8083 }]
---
